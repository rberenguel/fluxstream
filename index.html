<!doctype html>
<html>
  <head>
    <title>Flux</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="fonts/sixtyfour.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #05050a;
        font-family: "Sixtyfour", sans-serif;
        color: #fff;
        -webkit-user-select: none; /* Safari */
        user-select: none;
        -webkit-touch-callout: none; /* Disable iOS callout menu */
        touch-action: manipulation;
      }
      canvas {
        display: block;
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #05050a;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10002;
        cursor: pointer;
        text-align: center;
      }
      .splash-content h1 {
        font-size: clamp(48px, 12vw, 96px);
        color: #00ffff;
        margin: auto;
        margin-bottom: 40px;
        text-shadow:
          0 0 5px #ffff0055,
          0 0 8px #ffff00;
        max-width: 500px;
        width: 90%;
        text-align: center;
      }
      .splash-content .instructions {
        font-family: monospace;
        font-size: clamp(14px, 3vw, 16px);
        color: #cccccc;
        display: inline-block;
        border: 1px solid #40406a;
        padding: 20px 30px;
        background: rgba(10, 10, 20, 0.3);
      }
      .splash-content .instructions p {
        margin: 12px 0;
        display: grid;
        grid-template-columns: 120px auto;
        gap: 20px;
        text-align: left;
      }
      .splash-content .instructions p span:first-child {
        color: #ffffff;
        font-weight: bold;
        text-align: right;
      }
      .splash-content .start-prompt {
        margin-top: 50px;
        font-size: clamp(18px, 3vw, 24px);
        color: #ffffff;
        animation: blink 1.5s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      #grind-vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        box-shadow: none;
      }
      #grind-vignette.active {
        opacity: 1;
      }
      #grind-vignette.grind {
        box-shadow: inset 0 0 120px 40px rgba(255, 255, 0, 0.7);
      }
      #grind-vignette.speed {
        box-shadow: inset 0 0 120px 40px rgba(0, 255, 0, 0.6);
      }
      #grind-vignette.turbo {
        box-shadow: inset 0 0 120px 40px rgba(255, 0, 255, 0.7);
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: center;
        z-index: 10001;
        flex-direction: column;
      }
      .menu {
        text-align: center;
      }
      .menu h1 {
        font-size: clamp(48px, 12vw, 96px);
        margin-bottom: 20px;
      }
      .menu p {
        font-size: clamp(16px, 3vw, 24px);
      }
      /* --- FIX FOR iOS SAVE --- */
      #gameOverDOMContainer {
        -webkit-touch-callout: default !important;
        user-select: auto !important;
        margin-top: 20px;
      }
      image.journey {
        border: 5px solid #00ffff;
      }
    </style>
    <script src="libs/pixi8.1.5.min.js"></script>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <h1>FLUX</h1>
        <div class="instructions">
          <p><span>5 WHITE DOTS</span><span>NEXT LEVEL</span></p>
          <p><span>GREEN DOTS</span><span>SPEED BOOST</span></p>
          <p><span>MAGENTA DOTS</span><span>TURBO BOOST</span></p>
          <p><span>GRIND</span><span>TRAILS FOR FREE BOOST</span></p>
          <hr />
          <p><span>TURN</span><span>ARROWS / TAP SIDES</span></p>
          <p><span>ACTION</span><span>SPACE / TAP BOTH</span></p>
          <p><span>PAUSE</span><span>ESCAPE / TAP TOP</span></p>
        </div>
        <p class="start-prompt">TAP ANYWHERE TO START</p>
      </div>
    </div>
    <div id="grind-vignette"></div>
    <div id="pause-overlay" class="overlay">
      <div class="menu">
        <h1>PAUSED</h1>
        <p>Tap anywhere or press Escape to resume</p>
      </div>
    </div>
    <div id="game-over-overlay" class="overlay">
      <div class="menu">
        <h1 id="game-over-title">GAME OVER</h1>
        <p id="level-text"></p>
        <p id="game-over-subtitle">Tap to Restart</p>
      </div>
    </div>
    <script src="main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
  </body>
</html>

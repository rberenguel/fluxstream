<!doctype html>
<html>
  <head>
    <title>Fluxstream</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="fonts/sixtyfour.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #05050a;
        font-family: "Sixtyfour", sans-serif;
        color: #fff;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      canvas {
        display: block;
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #05050a;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10002;
        cursor: pointer;
        text-align: center;
      }
      .splash-content h1 {
        font-size: clamp(48px, 12vw, 96px);
        color: #00ffff;
        margin: auto;
        margin-bottom: 40px;
        text-shadow:
          0 0 5px #ffff0055,
          0 0 8px #ffff00;
        max-width: 500px;
        width: 90%;
        text-align: center;
      }
      .splash-content .instructions {
        font-family: monospace;
        font-size: clamp(14px, 3vw, 16px);
        color: #cccccc;
        display: inline-block;
        border: 1px solid #40406a;
        padding: 20px 30px;
        background: rgba(10, 10, 20, 0.3);
      }
      .splash-content .instructions p {
        margin: 12px 0;
        display: grid;
        grid-template-columns: 120px auto;
        gap: 20px;
        text-align: left;
      }
      .splash-content .instructions p span:first-child {
        color: #ffffff;
        font-weight: bold;
        text-align: right;
      }
      .splash-content .start-prompt {
        margin-top: 50px;
        font-size: clamp(18px, 3vw, 24px);
        color: #ffffff;
        animation: blink 1.5s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      #slipstream-vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        box-shadow: none;
      }
      #slipstream-vignette.active {
        opacity: 1;
      }
      #slipstream-vignette.slipstream {
        box-shadow: inset 0 0 120px 40px rgba(0, 255, 0, 0.6);
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10001;
        flex-direction: column;
      }
      .menu {
        text-align: center;
      }
      .menu h1 {
        font-size: clamp(48px, 12vw, 96px);
        margin-bottom: 20px;
      }
      .menu p {
        font-size: clamp(16px, 3vw, 24px);
      }
    </style>
    <script src="libs/pixi8.1.5.min.js"></script>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <h1>FLUXSTREAM</h1>
        <div class="instructions">
          <p><span>MOVE</span><span>ARROWS / TAP SIDES</span></p>
          <p><span>BOOST</span><span>SPACE / TAP BOTH</span></p>
          <p><span>SLIPSTREAM</span><span>ALIGN WITH RIVALS</span></p>
          <p><span>PAUSE</span><span>ESCAPE / TAP TOP</span></p>
        </div>
        <p class="start-prompt">TAP ANYWHERE TO START</p>
      </div>
    </div>
    <div id="slipstream-vignette"></div>
    <div id="pause-overlay" class="overlay">
      <div class="menu">
        <h1>PAUSED</h1>
        <p>Tap anywhere or press Escape to resume</p>
      </div>
    </div>
    <div id="game-over-overlay" class="overlay">
      <div class="menu">
        <h1>GAME OVER</h1>
        <p id="game-over-subtitle">Tap to Restart</p>
      </div>
    </div>
    <script src="fluxstream.js"></script>
  </body>
</html>
